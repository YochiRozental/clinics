services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: clinics
      POSTGRES_PASSWORD: clinics_dev_password
      POSTGRES_DB: clinics
    ports:
      - "5433:5432"
    volumes:
      - clinics_db_data:/var/lib/postgresql/data

volumes:
  clinics_db_data:
